specifications:
  # DESI Bright Galaxy Survey (BGS Bright), 0.0 < z < 0.4, area = 14000 deg^2.
  # Source: DESI Collaboration, 'Validation of the Scientific Program for the Dark Energy
  # Spectroscopic Instrument', arXiv:2306.06307, Table 7 (surface density per bin of width
  # 0.1, converted to dn/dOmega/dz) and the bias paragraph that follows it.
  # Linear bias b(z) = 1.34 / D(z) with D(0) = 1, evaluated per bin at
  # z_mid for flat LCDM with Omega_m = 0.32. The per-bin values are free
  # nuisance parameters in the Fisher matrix, not constrained to follow A / D(z).
  # sp_bias_root is the key prefix of the active model: to use the linear_log table set
  # sp_bias_model: 'linear_log' together with sp_bias_root: 'lnb'.
  # The paper forecasts were made with GoFish (https://github.com/ladosamushia/GoFish);
  # its public input file differs from Table 7, which is the authority here.
  # Generated by scripts/validation/generate_desi_validation_specs.py; do not edit by hand.
  'spec_sigma_dz': 0.001
  'spec_sigma_dz_type': 'constant'
  'area_survey_spectro': 14000
  'kmax_GCsp': 0.30
  'kmin_GCsp': 0.001
  'z_bins_sp':
    1: [0.00, 0.10]
    2: [0.10, 0.20]
    3: [0.20, 0.30]
    4: [0.30, 0.40]
  'dndOmegadz':
    1: 1011.0
    2: 2313.0
    3: 2169.0
    4: 973.0
  sp_bias_sample: 'g'
  sp_bias_model: 'linear'
  sp_bias_root: 'b'
  sp_bias_parametrization:
    linear:
      bg_1: 1.37622575
      bg_2: 1.45204009
      bg_3: 1.53188503
      bg_4: 1.61524181
    linear_log:
      lnbg_1: 0.31934479
      lnbg_2: 0.37296953
      lnbg_3: 0.42649902
      lnbg_4: 0.47948468
    linear_Qbias:
      bg_1: 1.37622575
      bg_2: 1.45204009
      bg_3: 1.53188503
      bg_4: 1.61524181
      A1: 0.02
      A2: -2.0
  shot_noise_model: 'constant'
  shot_noise_parametrization:
    constant:
      Ps_1: 0.0
      Ps_2: 0.0
      Ps_3: 0.0
      Ps_4: 0.0
  nonlinear_model: 'default'
  nonlinear_parametrization:
    vary_sigmap: True
    vary_sigmav: True
    rescale_sigma_pv:
      sigmap_1: 1.0
      sigmap_2: 1.0
      sigmap_3: 1.0
      sigmap_4: 1.0
      sigmav_1: 1.0
      sigmav_2: 1.0
      sigmav_3: 1.0
      sigmav_4: 1.0
    default:
