name: Draft PDF
on:
  # Build the JOSS draft on every push to any branch, so that each commit of a paper PR
  # produces a downloadable PDF (Actions -> run -> Artifacts -> paper).
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          # Path to the paper, relative to the repository root.
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: paper
          # The PDF is written next to paper.md.
          path: paper/paper.pdf
          archive: false
