name: Main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  # Manual run (Actions tab): builds, then publishes the current version to TestPyPI.
  workflow_dispatch:

env:
  # Change this to invalidate existing cache.
  CACHE_PREFIX: v0
  PYTHONPATH: ./

jobs:
  checks:
    name: Python ${{ matrix.python }} - ${{ matrix.task.name }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        #python: ["3.8", "3.10"]
        python: ["3.10"]
        task:
          - name: Test
            run: |
              pytest -v --color=yes tests/

        include:
          - python: "3.10"
            task:
              name: Lint
              run: ruff check .

          #- python: "3.10"
          #  task:
          #    name: Type check
          #    run: mypy .

          - python: "3.10"
            task:
              name: Build
              run: |
                python -m build

          - python: "3.10"
            task:
              name: Style
              run: |
                isort --check .
                black --check --diff .

          - python: "3.10"
            task:
              name: Metadata
              run: |
                python scripts/maintenance/release/check_version_consistency.py

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python environment
        uses: ./.github/actions/setup-venv
        with:
          python-version: ${{ matrix.python }}
          cache-prefix: ${{ env.CACHE_PREFIX }}

      #- name: Restore mypy cache
      #  if: matrix.task.name == 'Type check'
      #  uses: actions/cache@v3
      #  with:
      #    path: .mypy_cache
      #    key: mypy-${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('*requirements.txt') }}-${{ github.ref }}-${{ github.sha }}
      #    restore-keys: |
      #      mypy-${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('*requirements.txt') }}-${{ github.ref }}
      #      mypy-${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('*requirements.txt') }}

      - name: ${{ matrix.task.name }}
        run: |
          . .venv/bin/activate
          ${{ matrix.task.run }}

      - name: Upload package distribution files
        if: matrix.task.name == 'Build'
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist

      - name: Clean up
        if: always()
        run: |
          . .venv/bin/activate
          pip uninstall -y cosmicjellyfish

  docs:
    name: Docs (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Build documentation (warnings are errors)
        run: uv run sphinx-build -W --keep-going -b html docs/source docs/build/html

      # Download "docs-preview" from the run summary to inspect the built site.
      - name: Upload built site (PR preview)
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview
          path: docs/build/html
          retention-days: 14
          if-no-files-found: error

  # PyPI / TestPyPI publishing uses Trusted Publishing (OIDC): no API tokens or
  # passwords are stored in the repository. Each index has a "pending publisher"
  # configured on its website pointing at this workflow file and the GitHub
  # environment named below.
  #
  #   - tags like v1.4.0rc1 (or a manual run of this workflow) -> TestPyPI
  #   - tags like v1.4.0                                        -> PyPI
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [checks, docs]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'rc'))
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cosmicjellyfish/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python -c "import runpy; print(runpy.run_path('cosmicjellyfish/version.py')['VERSION'])")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match cosmicjellyfish/version.py (${VERSION})" >&2
            exit 1
          fi

      - name: Download package distribution files
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [checks, docs]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'rc')
    environment:
      name: pypi
      url: https://pypi.org/project/cosmicjellyfish/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check tag matches package version
        run: |
          VERSION=$(python -c "import runpy; print(runpy.run_path('cosmicjellyfish/version.py')['VERSION'])")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match cosmicjellyfish/version.py (${VERSION})" >&2
            exit 1
          fi

      - name: Download package distribution files
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [checks, docs, publish-testpypi, publish-pypi]
    # Run for every tag once the (skipped or successful) publish jobs are done.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install requirements
        run: |
          pip install --upgrade pip
          pip install uv
          uv sync --extra dev

      - name: Prepare environment
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Download package distribution files
        uses: actions/download-artifact@v8
        with:
          name: package
          path: dist

      - name: Generate release notes
        run: |
          # `uv sync` installs into .venv, so run through uv rather than the system python.
          uv run --no-sync python scripts/maintenance/release/release_notes.py > ${{ github.workspace }}-RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: ${{ github.workspace }}-RELEASE_NOTES.md
          prerelease: ${{ contains(env.TAG, 'rc') }}
          files: |
            dist/*
