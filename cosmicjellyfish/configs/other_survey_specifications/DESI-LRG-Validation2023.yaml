specifications:
  # DESI Luminous Red Galaxies (LRG), 0.4 < z < 1.1, area = 14000 deg^2.
  # Source: DESI Collaboration, 'Validation of the Scientific Program for the Dark Energy
  # Spectroscopic Instrument', arXiv:2306.06307, Table 7 (surface density per bin of width
  # 0.1, converted to dn/dOmega/dz) and the bias paragraph that follows it.
  # Linear bias b(z) = 1.7 / D(z) with D(0) = 1, evaluated per bin at
  # z_mid for flat LCDM with Omega_m = 0.32. The per-bin values are free
  # nuisance parameters in the Fisher matrix, not constrained to follow A / D(z).
  # Selecting sp_bias_model: 'linear_log' uses the 'lnb' root by default.
  # The paper forecasts were made with GoFish (https://github.com/ladosamushia/GoFish);
  # its public input file differs from Table 7, which is the authority here.
  # Generated by scripts/validation/generate_desi_validation_specs.py; do not edit by hand.
  'spec_sigma_dz': 0.001
  'spec_sigma_dz_type': 'constant'
  'area_survey_spectro': 14000
  'kmax_GCsp': 0.30
  'kmin_GCsp': 0.001
  'z_bins_sp':
    1: [0.40, 0.50]
    2: [0.50, 0.60]
    3: [0.60, 0.70]
    4: [0.70, 0.80]
    5: [0.80, 0.90]
    6: [0.90, 1.00]
    7: [1.00, 1.10]
  'dndOmegadz':
    1: 475.0
    2: 656.0
    3: 800.0
    4: 932.0
    5: 993.0
    6: 637.0
    7: 283.0
  sp_bias_sample: 'g'
  sp_bias_model: 'linear'
  sp_bias_root: 'b'
  sp_bias_parametrization:
    linear:
      bg_1: 2.15878800
      bg_2: 2.27169459
      bg_3: 2.38742930
      bg_4: 2.50557822
      bg_5: 2.62578668
      bg_6: 2.74775309
      bg_7: 2.87122216
    linear_log:
      lnbg_1: 0.76954695
      lnbg_2: 0.82052607
      lnbg_3: 0.87021718
      lnbg_4: 0.91851953
      lnbg_5: 0.96538054
      lnbg_6: 1.01078352
      lnbg_7: 1.05473778
    linear_Qbias:
      bg_1: 2.15878800
      bg_2: 2.27169459
      bg_3: 2.38742930
      bg_4: 2.50557822
      bg_5: 2.62578668
      bg_6: 2.74775309
      bg_7: 2.87122216
      A1: 0.02
      A2: -2.0
  shot_noise_model: 'constant'
  shot_noise_parametrization:
    constant:
      Ps_1: 0.0
      Ps_2: 0.0
      Ps_3: 0.0
      Ps_4: 0.0
      Ps_5: 0.0
      Ps_6: 0.0
      Ps_7: 0.0
  nonlinear_model: 'default'
  nonlinear_parametrization:
    vary_sigmap: True
    vary_sigmav: True
    rescale_sigma_pv:
      sigmap_1: 1.0
      sigmap_2: 1.0
      sigmap_3: 1.0
      sigmap_4: 1.0
      sigmap_5: 1.0
      sigmap_6: 1.0
      sigmap_7: 1.0
      sigmav_1: 1.0
      sigmav_2: 1.0
      sigmav_3: 1.0
      sigmav_4: 1.0
